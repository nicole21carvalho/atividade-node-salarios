<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade Node.js - Salários</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Atividade Node.js e JavaScript</h1>
      <p class="descricao">
        Digite vários salários para descobrir qual é o maior salário e visualizar a lista completa.
      </p>

      <form action="/calcular" method="POST">
        <label for="salarios">Informe os salários:</label>
        <textarea 
          id="salarios" 
          name="salarios" 
          rows="8" 
          placeholder="Exemplo:&#10;1500&#10;2.300,50&#10;1800&#10;3200"
          required></textarea>

        <p class="ajuda">
          Separe os salários por linha, espaço ou ponto e vírgula. Use vírgula para os centavos: 1.500,50.
        </p>

        <button type="submit">Calcular maior salário</button>
      </form>
    </section>
  </main>
</body>
</html>
